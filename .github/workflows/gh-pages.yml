name: Publish on GitHub pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron:  '30 3 * * */1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.165.0
  DEPENDENCY_MANAGER: npm
  PYTHON_VERSION: '3.13'

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
#      - name: Maximize build space
#        uses: easimon/maximize-build-space@master
#        with:
#          root-reserve-mb: 4096
#          temp-reserve-mb: 1096
#          remove-android: 'true'
#          remove-haskell: 'true'
#          remove-codeql: 'true'
#          remove-dotnet: 'true'

      - name: Free some disk space
        run: |
          sudo apt-get update
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' '^postgresql-.*' '^gfortran-.*' '^cmake-.*' '^aspnetcore-.*' '^libmono-.*' '^mono-.*' '^ruby.*' '^r-.*' || true
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/graalvm/ /usr/local/share/powershell /usr/local/lib/android /usr/local/lib/node_modules /usr/local/.ghcup/ /usr/share/dotnet/
          sudo apt-get autoremove -y
          sudo apt-get clean

      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
          logout: false

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Checkout submodules
        run: |
          ./scripts/github/checkout.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install required dependencies
        run: |
          ./scripts/github-setup.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Generate Files
        env:
          SKIP_IIIF: yes
        run: |
          ./scripts/setup.sh

      - name: Create IIIF derivates
        run: |
          docker run -v ${PWD}:${PWD} ghcr.io/cmahnke/iiif-action:latest-jxl-uploader sh -c "cd ${PWD} && ./scripts/iiif.sh"

      - name: Install Hugo
        run: |
          ./themes/projektemacher-base/scripts/github/setup-hugo.sh ${{ env.HUGO_VERSION }}

      - name: Get Hugo cache
        uses: actions/cache@v6
        with:
          path: resources
          key: hugo-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: hugo-cache-${{ runner.os }}

      - name: Generate stats
        run: |
          ./themes/projektemacher-base/scripts/stat.py

      - name: Build Hugo site
        run: hugo --printI18nWarnings --printUnusedTemplates

      - name: Run post build scripts
        run: bash -x ./scripts/post-build/index.sh

      - name: Index and cleanup
        run: |
          ./scripts/post-build.sh

      - name: Puppeteer
        run: |
          npx puppeteer install chrome@stable
          #npx puppeteer browsers install chrome
          ./themes/projektemacher-base/scripts/github/check-js-errors.sh

      # - name: Archive links
      #   run: python ./themes/projektemacher-base/scripts/archive.py -d docs/ -e projektemacher.org -a 14

      - name: Deploy site
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true

  archive:
    needs: deploy
    uses: ./.github/workflows/archive.yml
    secrets: inherit
